<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador Multi-Vista</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 15px; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        /* Encabezado y Selector de Vistas */
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #334155; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        h1 { font-size: 18px; font-weight: 600; }
        .controls { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-tab { padding: 6px 12px; font-size: 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; cursor: pointer; }
        .btn-tab.active { background: #2563eb; color: white; border-color: #2563eb; }

        /* VISTA 1: PIZARRA (PADLET / MASONRY) */
        .view-board { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .board-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .board-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; }
        .board-card .title { font-size: 12px; font-weight: 600; word-break: break-all; }

        /* VISTA 2: CARRUSEL / GALERÍA DESLIZANTE */
        .view-carousel { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px; scroll-snap-type: x mandatory; }
        .carousel-item { flex: 0 0 280px; background: #1e293b; border-radius: 12px; padding: 10px; scroll-snap-align: start; border: 1px solid #334155; }
        .carousel-item img, .carousel-item video { width: 100%; height: 320px; object-fit: cover; border-radius: 8px; }

        /* VISTA 3: POR CATEGORÍAS */
        .category-section { margin-bottom: 25px; }
        .category-title { font-size: 14px; text-transform: uppercase; color: #38bdf8; margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 4px; }
        .category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }

        /* VISTA 4: VISTA CUADRÍCULA / GRID MODIFICADA */
        .view-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .list-item { background: #1e293b; padding: 10px; border-radius: 8px; border: 1px solid #334155; font-size: 12px; word-break: break-all; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }

        /* Botones globales de acción */
        .btn-action { padding: 4px 8px; font-size: 11px; background: #2563eb; color: white; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; display: inline-block; text-align: center; }
        .btn-sec { background: #475569; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📌 Pizarra Multi-Vista</h1>
        <div class="controls">
            <button class="btn-tab active" onclick="switchView('board')">📋 Pizarra</button>
            <button class="btn-tab" onclick="switchView('carousel')">🎞️ Carrusel</button>
            <button class="btn-tab" onclick="switchView('categories')">🗂️ Por Tipos</button>
            <button class="btn-tab" onclick="switchView('list')">📄 Lista / Grid</button>
        </div>
    </div>

    <div id="loading">Cargando archivos del repositorio...</div>

    <!-- Modos de Vista -->
    <div id="viewBoard" class="view-board hidden"></div>
    <div id="viewCarousel" class="view-carousel hidden"></div>
    <div id="viewCategories" class="hidden"></div>
    <div id="viewList" class="view-list hidden"></div>
</div>

<script>
    const USUARIO = 'sergnaru95';
    const REPO = 'poquetzal-1';
    const API_URL = `https://api.github.com/repos/${USUARIO}/${REPO}/contents/`;

    let globalFiles = [];

    async function init() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            
            globalFiles = data.filter(f => f.name.toLowerCase() !== 'index.html' && !f.name.startsWith('.'));
            document.getElementById('loading').classList.add('hidden');
            
            renderAll();
            switchView('board');
        } catch (e) {
            document.getElementById('loading').innerText = 'Error al cargar los datos de GitHub.';
        }
    }

    function getType(filename) {
        const ext = filename.split('.').pop().toLowerCase();
        if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) return 'imagen';
        if (['mp4', 'webm', 'mov'].includes(ext)) return 'video';
        if (['mp3', 'wav', 'ogg'].includes(ext)) return 'audio';
        return 'documento';
    }

    function renderAll() {
        renderBoard();
        renderCarousel();
        renderCategories();
        renderList();
    }

    function renderBoard() {
        const container = document.getElementById('viewBoard');
        container.innerHTML = globalFiles.map(f => {
            const type = getType(f.name);
            let media = `<div style="height:100px; background:#334155; border-radius:6px; display:flex; align-items:center; justify-content:center;">📄 ${type}</div>`;
            if (type === 'imagen') media = `<img src="${f.download_url}" loading="lazy">`;
            if (type === 'video') media = `<video src="${f.download_url}" controls style="width:100%; height:160px; object-fit:cover; border-radius:6px;"></video>`;

            return `
                <div class="board-card">
                    ${media}
                    <div class="title">${f.name}</div>
                    <div>
                        <a class="btn-action" href="${f.download_url}" target="_blank">Abrir</a>
                        <a class="btn-action btn-sec" href="${f.download_url}" download>Descargar</a>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderCarousel() {
        const container = document.getElementById('viewCarousel');
        const mediaFiles = globalFiles.filter(f => ['imagen', 'video'].includes(getType(f.name)));
        
        container.innerHTML = mediaFiles.map(f => {
            const type = getType(f.name);
            const content = type === 'imagen' 
                ? `<img src="${f.download_url}">` 
                : `<video src="${f.download_url}" controls></video>`;

            return `
                <div class="carousel-item">
                    ${content}
                    <p style="font-size:12px; margin-top:6px;" class="title">${f.name}</p>
                </div>
            `;
        }).join('');
    }

    function renderCategories() {
        const container = document.getElementById('viewCategories');
        const groups = { imagen: [], video: [], documento: [], audio: [] };
        
        globalFiles.forEach(f => groups[getType(f.name)].push(f));

        let html = '';
        for (const [type, files] of Object.entries(groups)) {
            if (files.length === 0) continue;
            html += `
                <div class="category-section">
                    <div class="category-title">${type}s (${files.length})</div>
                    <div class="category-grid">
                        ${files.map(f => `
                            <div class="board-card">
                                <span class="title">${f.name}</span>
                                <a class="btn-action" href="${f.download_url}" target="_blank">Abrir / Descargar</a>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    function renderList() {
        const container = document.getElementById('viewList');
        container.innerHTML = globalFiles.map(f => `
            <div class="list-item">
                <strong>${f.name}</strong>
                <div style="display:flex; gap:4px; margin-top:6px;">
                    <a class="btn-action" href="${f.download_url}" target="_blank" style="flex:1;">Abrir</a>
                    <a class="btn-action btn-sec" href="${f.download_url}" download style="flex:1;">Descargar</a>
                </div>
            </div>
        `).join('');
    }

    function switchView(viewName) {
        document.getElementById('viewBoard').classList.add('hidden');
        document.getElementById('viewCarousel').classList.add('hidden');
        document.getElementById('viewCategories').classList.add('hidden');
        document.getElementById('viewList').classList.add('hidden');

        document.querySelectorAll('.btn-tab').forEach(b => b.classList.remove('active'));

        if (viewName === 'board') {
            document.getElementById('viewBoard').classList.remove('hidden');
            event.target.classList.add('active');
        } else if (viewName === 'carousel') {
            document.getElementById('viewCarousel').classList.remove('hidden');
            event.target.classList.add('active');
        } else if (viewName === 'categories') {
            document.getElementById('viewCategories').classList.remove('hidden');
            event.target.classList.add('active');
        } else if (viewName === 'list') {
            document.getElementById('viewList').classList.remove('hidden');
            event.target.classList.add('active');
        }
    }

    init();
</script>

</body>
</html>
